<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- The Thue-Morse signs of length 16 in four rows of four: the classic split of {1, ..., 16} into two
       sets with equal power sums for exponents 0..3.  Dark = +1, light = -1. -->
  <rect width="16" height="16" rx="2.5" fill="#ffffff"/>
  <g fill="#1b1d22">
    <rect x="4" y="0" width="8" height="4"/>
    <rect x="0" y="4" width="4" height="8"/>
    <rect x="12" y="4" width="4" height="8"/>
    <rect x="4" y="12" width="8" height="4"/>
  </g>
  <rect x="0.25" y="0.25" width="15.5" height="15.5" rx="2.4" fill="none" stroke="#1b1d22" stroke-width="0.5"/>
</svg>
